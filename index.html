<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5ede3"><meta name="description" content="Il menu digitale di Zest"><title>Zest · Drinks Menu</title><style>
@import url("https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap");
:root{--bg:#f5ede3;--ink:#292d30;--muted:#82746a;--line:#c9b6a5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.wrap{max-width:760px;margin:auto;padding:25px 22px 90px}header{text-align:center;padding:18px 0 27px}.brand{width:min(240px,64vw);height:auto;display:block;margin:0 auto}.sub{font-size:11px;letter-spacing:.42em;margin-top:4px}.rule{height:1px;background:var(--line);margin:22px 0}.intro{font-style:italic;color:var(--muted);font-size:14px}nav{display:flex;overflow-x:auto;gap:9px;padding:8px 0 17px;scrollbar-width:thin;position:sticky;top:0;background:var(--bg);z-index:5}nav button{flex-shrink:0;background:transparent;border:1px solid var(--line);border-radius:30px;padding:11px 15px;color:var(--ink);font:14px Georgia;cursor:pointer}nav button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}main{position:relative;min-height:500px}.watermark{position:fixed;width:min(600px,94vw);height:76vh;object-fit:contain;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.12;pointer-events:none;z-index:0}section{position:relative;z-index:1}h1{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(35px,7.5vw,58px);font-weight:400;letter-spacing:-.025em;text-align:center;margin:30px 0 12px}h2{font-size:17px;letter-spacing:.15em;margin:32px 0 12px;text-transform:uppercase}.item{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #c9b6a550}.name{font-size:16px;letter-spacing:.035em}.price{font-size:16px;white-space:nowrap}.detail{font-family:Arial,sans-serif;font-size:12px;color:#675c54;line-height:1.55;margin:5px 0 0}.wine{padding:18px 0;border-bottom:1px solid #c9b6a580}.wine .item{padding:0;border:0}.wine .detail{max-width:90%}.prices{margin-top:9px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px}.empty{color:var(--muted);text-align:center;padding:40px 0}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:55px}.smallbrand{width:145px;opacity:.8;margin:0 auto 12px;display:block}button:focus-visible{outline:3px solid #a17a58;outline-offset:2px}@media(max-width:390px){.wrap{padding-left:16px;padding-right:16px}.name,.price{font-size:15px}}
</style></head><body><div class="wrap"><header><img class="brand" src="Assets/zest-lettering.png" alt="ZEST"></header><nav id="nav" aria-label="Categorie del menu"></nav><main><img class="watermark" src="Assets/simbolo.png" alt="" aria-hidden="true"><section id="content" aria-live="polite"></section></main><footer><div class="rule"></div><img class="smallbrand" src="Assets/zest-lettering.png" alt="ZEST"><div>Menu digitale · Prezzi in euro</div></footer></div><script src="menu.js"></script><script>
const nav=document.getElementById('nav'),content=document.getElementById('content');const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function show(i){current=i;nav.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',i===j)});const cat=MENU[i];let html=`<h1>${esc(cat.title)}</h1><div class="rule"></div>`;if(cat.groups){for(const group of cat.groups){html+=`<h2>${esc(group.name)}</h2>`;for(const it of group.items)html+=render(it)}}else for(const it of cat.items)html+=render(it);content.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
function render(it){if(it.wine){let p=it.prices.map(v=>`<span>${esc(v.label)}: <strong>${eur(v.amount)}</strong></span>`).join('');return `<article class="wine"><div class="item"><strong class="name">${esc(it.name)}</strong></div><div class="detail">${esc(it.detail)}</div><div class="prices">${p}</div></article>`}return `<div class="item"><span class="name">${esc(it.name)}</span><span class="price">${eur(it.price)}</span></div>`}
MENU.forEach((cat,i)=>{let b=document.createElement('button');b.textContent=cat.title;b.onclick=()=>show(i);nav.appendChild(b)});show(0);
</script></body></html>
