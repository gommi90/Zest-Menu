<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5ede3"><meta name="description" content="Il menu digitale di Zest"><title>Zest · Drinks Menu</title><style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Kaushan+Script&display=swap');
:root{--bg:#f5ede3;--ink:#292d30;--muted:#82746a;--line:#c9b6a5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:4px 22px 80px}
header{text-align:center;padding:0;margin:0 0 -22px}
.brand{width:112%;max-width:none;height:auto;display:block;margin:0 0 0 -6%}
.sub{font-size:11px;letter-spacing:.42em;margin-top:4px}
.rule{height:1px;background:var(--line);margin:22px 0}
.intro{font-style:italic;color:var(--muted);font-size:14px}
/* Navigazione editoriale: sottolineatura per la categoria attiva */
nav{display:flex;overflow-x:auto;gap:27px;padding:8px 1px 11px;scrollbar-width:thin;position:sticky;top:0;background:var(--bg);z-index:5;align-items:center;scroll-padding-inline:10px}
nav button{position:relative;flex-shrink:0;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:12px 0 11px;color:var(--muted);font-family:'DM Sans',Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:.105em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:color .2s,border-color .2s}
nav button.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
nav button:hover{color:var(--ink)}
main{position:relative;min-height:500px}
.watermark{position:fixed;width:min(600px,94vw);height:76vh;object-fit:contain;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.12;pointer-events:none;z-index:0}
section{position:relative;z-index:1;touch-action:pan-y}
h1{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(35px,7.5vw,58px);font-weight:400;letter-spacing:-.025em;text-align:center;margin:25px 0 12px}
h2{font-family:'DM Sans',Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:.17em;margin:32px 0 12px;text-transform:uppercase}
.item{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #c9b6a550}
.name{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;letter-spacing:.005em;line-height:1.13}
.price{font-family:'DM Sans',Arial,sans-serif;font-size:14px;font-weight:500;letter-spacing:.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.detail{font-family:'DM Sans',Arial,sans-serif;font-size:12px;color:#675c54;line-height:1.55;margin:5px 0 0}
.wine{padding:18px 0;border-bottom:1px solid #c9b6a580}
.wine .item{padding:0;border:0}
.wine .detail{max-width:90%}
.prices{margin-top:9px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:55px}
.smallbrand{width:145px;opacity:.8;margin:0 auto 12px;display:block}
button:focus-visible{outline:2px solid #a17a58;outline-offset:3px}
@media(max-width:390px){.wrap{padding-left:16px;padding-right:16px}nav{gap:21px}.name{font-size:24px}.price{font-size:13px}}
h2{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:700;letter-spacing:.13em;margin:38px 0 20px}h2::after{content:'';height:2px;flex:1;background:#b7a18b}
</style></head><body><div class="wrap"><header><img class="brand" src="Assets/zest-lettering.png" alt="ZEST"></header><nav id="nav" aria-label="Categorie del menu"></nav><main><img class="watermark" src="Assets/simbolo-nuovo.png" alt="" aria-hidden="true"><section id="content" aria-live="polite"></section></main><footer><div class="rule"></div><img class="smallbrand" src="Assets/zest-lettering.png" alt="ZEST"></footer></div><script src="menu.js"></script><script>
const nav=document.getElementById('nav'),content=document.getElementById('content');const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function show(i){current=i;nav.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',i===j)});const active=nav.querySelectorAll('button')[i];if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});const cat=MENU[i];let html=`<h1>${esc(cat.title)}</h1><div class="rule"></div>`;if(cat.groups){for(const group of cat.groups){html+=`<h2>${esc(group.name)}</h2>`;for(const it of group.items)html+=render(it)}}else for(const it of cat.items)html+=render(it);content.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
function render(it){if(it.wine){let p=it.prices.map(v=>`<span>${esc(v.label)}: <strong>${eur(v.amount)}</strong></span>`).join('');return `<article class="wine"><div class="item"><strong class="name">${esc(it.name)}</strong></div><div class="detail">${esc(it.detail)}</div><div class="prices">${p}</div></article>`}return `<div class="item"><span class="name">${esc(it.name)}</span><span class="price">${eur(it.price)}</span></div>`}
// Swipe solo nell'area dei prodotti: il movimento verticale resta nativo.
let touchStartX=0,touchStartY=0,touchStartTime=0;
content.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now();
},{passive:true});
content.addEventListener('touchend',e=>{
  if(e.changedTouches.length!==1||!touchStartTime)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const elapsed=Date.now()-touchStartTime;
  touchStartTime=0;
  if(elapsed>900||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.4)return;
  const next=current+(dx<0?1:-1);
  if(next>=0&&next<MENU.length)show(next);
},{passive:true});
MENU.forEach((cat,i)=>{let b=document.createElement('button');b.textContent=cat.title;b.onclick=()=>show(i);nav.appendChild(b)});show(0);
</script></body></html>
